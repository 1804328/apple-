name = "strong-reminder"
main = "src/index.js"
compatibility_date = "2026-10-01"

# cron trigger: every minute, check due reminders and escalate
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "strong-reminder"
database_id = "e4d8410f-2364-416d-9411-1be57d16edb2"

[vars]
# Base URL used to build "ack" links inside WeChat/WeCom pushes.
# Replace with the custom domain once it is bound to the Worker.
PUBLIC_BASE_URL = "https://strong-reminder.1804328114.workers.dev"

# Secrets (set via `wrangler secret put`, never store here):
#   API_KEY
#   WECOM_WEBHOOK            (recommended, free)
#   WXPUSHER_APP_TOKEN + WXPUSHER_UIDS  (alternative, free)
#   PUSHPLUS_TOKEN           (legacy, now paid)
